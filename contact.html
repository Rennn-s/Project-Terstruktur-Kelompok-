<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactNarkopika</title>
    <style>
        
        body{
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: rgb(21, 75, 33);
            color: white;
        }

        header{
            background-color: rgb(9, 56, 19);
            padding: 25px;
        }

        nav{
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a{
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        nav a:hover{
            color: orange;
        }

        .logo{
            padding-left: 20px;
        }

        .contact-container{
            display: flex;
            gap: 40px;
            padding: 60px;
        }

        .contact-info,.contact-form{
            flex: 1;
            background-color: rgb(30, 92, 45);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        .contact-info h1,.contact-form h1{
            margin-top: 0;
            color: rgb(255, 232, 189);
        }

        .contact-info p{
            font-size: 18px;
            margin-bottom: 25px;
        }

        .contact-info a{
            text-decoration: none;
            color: white;
        }

        .contact-info a:hover{
            color: orange;
        }

        input,textarea{
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea{
            height: 150px;
            resize: none;
        }

        button{
            background-color: orange;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover{
            background-color: rgb(255, 145, 0);
        }

        footer{
            background-color: rgb(9, 56, 19);
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

    </style>

</head>
<body>


      <header>
        <nav>
            <img class="logo" src="img/logonarkop.jpg" alt="" width="90px">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="store.html">Store</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    
    <section class="contact-container">
        <div class="contact-info">
            <h1>Hubungi Kami</h1>
            <p>
                <a href="https://maps.google.com/?q=Jl.+Hos+Cokroaminoto+No.+330" target="_blank">
                    📍 Jl. Hos Cokroaminoto No. 330
                </a>
            </p>
            <p>
                <a href="tel:081234567890">
                    📞 0812-3456-7890
                </a>
            </p>
            <p>
                <a href="mailto:narkopika@gmail.com">
                    ✉️ narkopika@gmail.com
                </a>
            </p>
            <p>
                🕒 Buka Setiap Hari 07.00 WIB - 22.00 WIB
            </p>
        </div>


        <div class="contact-form">
            <h1>Kirim Pesan</h1>
            <form>
                <input type="text" placeholder="Masukkan Nama">
                <input type="email" placeholder="Masukkan Email">
                <textarea placeholder="Tulis pesan Anda..."></textarea>
                <button type="submit">
                    Kirim Pesan
                </button>
            </form>
        </div>
    </section>


    <footer>
        <p>
            © 2026 Narkopika Coffee
        </p>
    </footer>

</body>
</html>

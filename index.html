<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narkopika</title>

    <style>
        body{
             margin: 0;
        }

        header{
            background-color: rgb(9, 56, 19);
            width: auto;
            height: 150px;
        }

        nav{
            /* background-image: url("img/named.jpg"); */
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        a{
            text-decoration: none;
            color: rgb(243, 240, 240);
        }

        .logo{
            padding: 30px;
        }

        .pos1{
            display: flex;
            align-items: center;
            background-color: rgb(22, 61, 31);
            padding: 40px;
            gap: 30px;
        }
        .pos1 > .text1{
            flex: 1;
        }

        .pos1 > section{
            flex: 1;
        }

        .pos1 > .gambar1{
             flex: 1;
             height: 700px;
             background-image: url("img/produk.jpg");
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             border-radius: 20px;
             box-shadow: 10px 10px 10px 10px;
        }

       .pos1 > .text1 {
             padding: 5dvw;
        }

       .pos1 > .text1 > h1 {
             font-family: Verdana, Geneva, Tahoma, sans-serif;
             font-weight: bold;
             color: rgb(255, 232, 189);
        }

        .pos1 > .text1 > p {
             font-family: Verdana, Geneva, Tahoma, sans-serif;
             font-size: 2rem;
        }

        .pos2 {
             flex: 1;
             background-color: rgb(21, 75, 33);
             display: flex;
             flex-direction: row;
             gap: 30px;
             padding: 40px;
        }

        .pos2 > section {
             flex: 1;
        }

        .pos2 > .gambar2 {
             flex: 1;
             background-image: url("img/product1.jpeg");
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
             border-radius:20px;
             height: 600px;
             /* width: 300px; */
             box-shadow: 10px 10px 10px 10px;
        }

        .pos2 > .text2 {
             padding: 5dvw;
        }

        .pos2 > .text2 > h1 {
             font-family: Verdana, Geneva, Tahoma, sans-serif;
             font-weight: bold;
             color: rgb(255, 232, 190);
        }

        .pos2 > .text2 > p {
             font-family: Verdana, Geneva, Tahoma, sans-serif;
             font-size: 1.5rem;
             text-align: justify;
             color: white;
        }

        footer{
            flex: 3;
            background-color:  rgb(9, 56, 19);
            display: flex;
            flex-direction: row;
            height: 150px;
        }

        footer > section{
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer >section > p{
            color: white;
        }

        button {
            background-color: rgb(72, 110, 67);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            font-size: 30px;
            border-color: transparent;
            width: 400px;
            height: 100px;
            margin-left: 0px;
        }

        .promo {
            font-size: 40px;
            font-weight: bold;
            color: red;
        }

        .harga {
            font-size: 40px;
            font-weight: bold;
            color: rgb(255, 255, 255);
        }

        .produk {
            font-size: 40px;
            font-weight: bold;
            color: rgb(255, 255, 255);
        }


    </style>

</head>



<body>

    <main class="first">

    <header>


        <nav>
            <img class="logo" src="img/logonarkop.jpg"alt="" width=" 100px">
            <a href="">Home</a>
            <a href="about.html">About</a>
            <a href="">Product</a>
            <a href="">Store</a>
            <a href="">Contact</a>
        </nav>
    </header>

    <main>
    <section class="pos1">
    <section class="text1">
        <h1>Narkopika</h1>
        <label class="produk">Black Series</label>
        <br><br>
        <label class="promo">
        <del>Rp. 35.000</del>
        </label>
        <label class="harga">Rp. 30.000</label>
        <br><br>
        <button>ORDER SEKARANG</button>
    </section>
    <section class="gambar1"></section>
    </section>
            

    <section class="pos2">
    <section class="text2">
        <h1>Narkopika</h1>
        <p>
            "Crafting character in every roast."
            <br></br>
            Mengolah setiap biji dengan presisi untuk menghadirkan rasa terbaik dalam setiap cangkir kopi.
        </p>
    </section>
    <section class="gambar2"></section>
    </section>
    </main>
    
    <footer>
        <section>
            <img src="img/logonarkop.jpg" alt="" width="100px">
        </section>
        <section>
            <p>Jl. Hos Cokroaminoto No. 330</p>
        </section>
    </footer>

    </main>

</html>
